# kgx/semantic/gazetteer.yaml
#
# THE DETERMINISTIC EXTRACTION ROUTE (framework §7, ~60% of assertions —
# higher here, because Cloud/AI is an enumerable domain in a way that people
# and organisations are not).
#
# Structure:  class -> owner -> canonical: [aliases]
#             owner "_" means no vendor owner.
#
# MATCHING IS SEPARATOR-INSENSITIVE. "Retrieval-Augmented Generation",
# "Retrieval Augmented Generation" and "RAG" resolve to one entity. The v0.1
# flat table missed 37 documents of "Augmented Generation" precisely because
# it could not bridge a hyphen. Aliases are not bookkeeping — they are the
# query-expansion dictionary (§8).
#
# ADDITIONS are evidence-driven: every term below was either observed in the
# seed pass or appeared in candidate_terms.tsv at >= 25 documents. Terms are
# NOT added speculatively; the growth queue exists for that.

version: 0.1.0
ontology_version: 0.1.0

matching:
  separator_insensitive: true      # [-_\s] interchangeable inside a term
  longest_match_wins: true         # "Azure OpenAI Service" beats "Azure"
  case_sensitive_acronyms: true    # IAM, REST, ACID must not match prose
  min_chars: 2

# ---------------------------------------------------------------------------
# HUB EXCLUSIONS — terms too generic to be entities.
# A term present in >30% of documents connects everything to everything, which
# is the disease the old co-occurrence graph died of. Excluded unless a CQ
# demands it (AWS/Azure survive because CQ-005 counts them).
# ---------------------------------------------------------------------------
hub_exclusions:
  [API, LLM, JSON, XML, YAML, HTML, SQL, URL, CLI, RAM, CPU, DATA, MODEL,
   USER, SYSTEM, LAYER, AGENT, CLOUD, SECURITY, CONTROL, RESULT, TOTAL,
   ORDER, SELECT, POST, GET, NOT, END, PASS, ONLY]

# ---------------------------------------------------------------------------
# AMBIGUOUS — same surface form, different entities. The matcher emits these
# as UNRESOLVED mentions requiring type/context disambiguation rather than
# asserting a link. "Apple the company merges with Apple the fruit" (§8).
# ---------------------------------------------------------------------------
ambiguous:
  Vault:      [HashiCorp Vault, Azure Key Vault]
  OpenSearch: [Amazon OpenSearch, OpenSearch (OSS)]
  Lambda:     [AWS Lambda, lambda function]
  Bedrock:    [Amazon Bedrock, bedrock (figurative)]
  Phoenix:    [Arize Phoenix, phoenix (figurative)]
  Flux:       [Flux CD, flux (figurative)]
  Consul:     [HashiCorp Consul]

# ---------------------------------------------------------------------------
# NOISE STOPLIST — for the candidate-mining pass, not the matcher.
# candidate_terms.tsv was dominated by three noise families; these rules keep
# the growth queue reviewable.
# ---------------------------------------------------------------------------
noise_rules:
  reject_hyphenated_english: true   # real-time, end-to-end, third-party, fine-grained
  reject_allcaps_english: true      # DATA, MODEL, NOT, ORDER — table headers and emphasis
  reject_ordinal_headings: true     # Phase 1, Step 2, Tier 3, III
  reject_pii_tokens: true           # names/places from identity documents
pii_stoplist:
  [SINGH, RACHPAL, JASSAL, KAUR, JAGDISH, KIRANJEET, PUNJAB, INDIA, INDIAN,
   TOWN, BANK, ENCLAVE, MARKS, PIN, CARD, Rachpal Singh, Rachpal Singh Jassal]

